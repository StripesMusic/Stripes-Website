<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#151613" />
    <script>
      // the saved theme, before anything paints
      try {
        if (localStorage.getItem("s-theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#cdcec8";
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500&family=Archivo:wdth,wght@62..125,100..900&family=Doto:wght@400..900&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stripes</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #151613;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #cdcec8;
      }
      #root {
        height: 100%;
      }
    </style>
    <meta name="description" content="Stripes: melodic dance music producer and cover artist. Releases, cover art and release packs." />
    <link rel="icon" href="/favicon.png" />
    <meta property="og:title" content="Stripes" />
    <meta property="og:description" content="Stripes' Official Website" />
    <meta property="og:image" content="/social-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/social-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
