# The content panel (Pages CMS, app.pagescms.org): forms for the site's lists, saved straight to
# src/content/*.json in this repo. Every save is a commit, and Cloudflare rebuilds the site.
# Images and videos stay in the assets bucket: upload them there and paste their link.
# Each list is stored oldest first, so new entries go at the bottom and get the next number.

content:
  - name: artwork
    label: Designs
    type: file
    path: src/content/artwork.json
    format: json
    fields:
      - name: items
        label: Designs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '#{index}   {date} · {title}'
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: category
            label: Kind
            type: select
            required: true
            options:
              values:
                - name: 2d
                  label: 2D cover
                - name: 3d
                  label: 3D cover
                - name: animations
                  label: Animation (not part of a cover)
                - name: lyric-videos
                  label: Lyric video
                - name: misc
                  label: Misc
                - name: websites
                  label: Website
                - name: set-visuals
                  label: Set visuals
          - name: type
            label: Type
            type: string
          - name: date
            label: Date
            type: string
            required: true
          - name: client
            label: Client
            type: string
          - name: release
            label: Release
            type: string
          - name: details
            label: Description
            type: text
          - name: image
            label: Image link
            type: string
            required: true
          - name: featured
            label: Feature at the top
            type: boolean
          - name: visuals
            label: Visuals
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{kind} {name}'
            fields:
              - name: kind
                label: What is it
                type: select
                required: true
                options:
                  values:
                    - name: version
                      label: Alternate version
                    - name: animated-cover
                      label: Animated cover (Spotify Canvas .mp4)
                    - name: lyric-video
                      label: Lyric video (YouTube link)
                    - name: clip
                      label: Video clip (.mp4)
                    - name: flyer
                      label: Flyer
                    - name: post
                      label: Social post
                    - name: reel
                      label: Reel / story video (.mp4)
                    - name: banner
                      label: Banner (SoundCloud, YouTube…)
                    - name: thumbnail
                      label: YouTube thumbnail
                    - name: background
                      label: Background (textless/logoless)
                    - name: wallpaper
                      label: Wallpaper
                    - name: process
                      label: Process shot
                    - name: mockup
                      label: Mockup
                    - name: other
                      label: Other (add new, name it below)
              - name: link
                label: Link
                type: string
                required: true
              - name: name
                label: Name
                type: string
          - name: videoUrl
            label: Video link
            type: string
          - name: youtubeUrl
            label: YouTube or site link
            type: string
          - name: software
            label: Tools
            type: string
            list: true
          - name: credit
            label: Made with
            type: object
            fields:
              - name: name
                label: Name
                type: string
              - name: href
                label: Link
                type: string
          - name: id
            label: Number
            type: number

  - name: releases
    label: Music
    type: file
    path: src/content/releases.json
    format: json
    fields:
      - name: items
        label: Releases
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '#{index}   {date} · {title}'
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: type
            label: Type
            type: select
            required: true
            options:
              values: [Single, Official Remix, Unofficial Remix, Unofficial Edit, Unofficial Flip]
          - name: date
            label: Release date
            type: string
            required: true
            description: 'Day, month and year, like "09 Oct 2026". The list sorts itself, newest first.'
          - name: image
            label: Cover link
            type: string
            required: true
            description: 'From the assets bucket: https://assets.musicbystripes.com/releases%20cover%20arts/…'
          - name: link
            label: Page
            type: string
            required: true
            description: 'The release page, like "/link/forgetyou", or a full link elsewhere.'
          - name: preview
            label: Preview clip
            type: string
            description: 'Leave empty if the clip in previews/ is named after the page (forgetyou.mp3). Type its name if it differs, or "none" if there is no clip yet.'
          - name: collaborators
            label: With
            type: object
            list: true
            fields:
              - name: name
                label: Name
                type: string
              - name: image
                label: Photo link
                type: string
              - name: link
                label: Spotify link
                type: string

  - name: drums
    label: Drum covers
    type: file
    path: src/content/drums.json
    format: json
    fields:
      - name: items
        label: Drum covers
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '#{index}   {date} · {artist} - {title}'
        fields:
          - name: title
            label: Song
            type: string
            required: true
          - name: artist
            label: Artist
            type: string
            required: true
          - name: date
            label: Date
            type: string
            required: true
            description: 'Month and year, like "May 2026".'
          - name: youtubeId
            label: YouTube video ID
            type: string
            required: true
            description: 'The 11 characters after "v=" in the video link.'

  - name: socials
    label: Socials
    type: file
    path: src/content/socials.json
    format: json
    fields:
      - name: items
        label: Links
        description: In the order they appear on the site.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{name}'
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: href
            label: Link
            type: string
            required: true
